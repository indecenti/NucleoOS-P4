# CI: every push to main and every PR that touches firmware code builds the firmware from a clean
# checkout, enforces its memory budgets, and runs the host unit tests + fuzzers for the parsers of
# untrusted input. Kept lean for the free Actions quota: no schedule, docs / SD content / tools never
# trigger it, short fuzzing by default; a long fuzz is a manual run (Actions > ci > Run workflow).
# Nothing here needs the board.
name: ci

on:
  push:
    branches: [main]
    paths:
      - "components/**"
      - "main/**"
      - "ports/**"
      - "sdk/**"
      - "tests/host/**"
      - "CMakeLists.txt"
      - "partitions.csv"
      - "sdkconfig.defaults*"
      - "dependencies.lock"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "components/**"
      - "main/**"
      - "ports/**"
      - "sdk/**"
      - "tests/host/**"
      - "CMakeLists.txt"
      - "partitions.csv"
      - "sdkconfig.defaults*"
      - "dependencies.lock"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: "Seconds per fuzzer per arch"
        default: "120"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  firmware:
    name: Firmware build + memory budgets
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Trust the workspace (container runs as another user)
        run: git config --global --add safe.directory '*'

      - name: WAMR (pinned commit + project patch)
        run: sh tools/ci/fetch_wamr.sh

      - name: Component cache
        uses: actions/cache@v4
        with:
          path: managed_components
          key: idf-components-${{ hashFiles('dependencies.lock') }}

      # The image ships a newer idf-component-manager than the developer installs. That version
      # re-solves after the Kconfig pass and treats "components.espressif.com" and
      # "components.espressif.com/" as two registries, so lvgl 9.6 lands next to the pinned 9.5.0.
      # Use the manager the lock was written with.
      - name: Component manager (same version as the dev toolchain)
        run: |
          . "$IDF_PATH/export.sh" >/dev/null
          python -m pip install -q "idf-component-manager==2.4.11"
          python -m pip show idf-component-manager | grep -i '^version'

      - name: Build
        run: |
          . "$IDF_PATH/export.sh" >/dev/null
          idf.py build

      # A rewritten lock means the build did not use the locked component set.
      - name: Lock file unchanged
        run: |
          if ! git diff --exit-code -- dependencies.lock; then
            echo "::error file=dependencies.lock::the component manager re-solved dependencies; pin the new versions in main/idf_component.yml"
            exit 1
          fi

      - name: Memory budgets
        run: |
          . "$IDF_PATH/export.sh" >/dev/null
          python tools/ci/check_budgets.py build

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          retention-days: 14
          path: |
            build/nucleos-anima.bin
            build/nucleos-anima.elf
            build/nucleos-anima.map

  host-tests:
    name: Host unit tests + fuzzers (64/32-bit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang gcc-multilib g++-multilib

      # What the fuzzers learned in earlier runs (tests/host/out, not committed) is carried forward.
      - name: Fuzzer corpus cache
        uses: actions/cache@v4
        with:
          path: tests/host/out
          key: fuzz-corpus-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ github.ref_name }}-
            fuzz-corpus-main-

      - name: Unit tests + fuzzers
        env:
          CI_SECS: ${{ inputs.fuzz_seconds || '20' }}
        run: make -C tests/host ci CI_SECS="$CI_SECS"

      - name: Upload fuzzer findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings-${{ github.sha }}
          retention-days: 30
          path: |
            tests/host/out/*/x*-crash-*
            tests/host/out/*/x*-leak-*
            tests/host/out/*/x*-timeout-*
            tests/host/out/*/x*-oom-*
            tests/host/out/*/*.log
